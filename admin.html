<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Import Massal Key</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
    .card { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
    label { font-weight: bold; display: block; margin-top: 15px; }
    select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: none; box-sizing: border-box; }
    textarea { height: 120px; font-family: monospace; background: #2a2a2a; color: #fff; }
    select { background: #2a2a2a; color: #fff; }
    button { background: #6200ee; color: #fff; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 15px; }
    button:hover { background: #3700b3; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<script>
  // Proteksi Password Admin
  const pass = prompt("Masukkan Password Admin:");
  if (pass !== "220230") {
    alert("Password Salah! Anda tidak memiliki akses.");
    window.location.href = "index.html";
  }
</script>

<div class="card">
  <h2>⚡ Halaman Import Massal Key</h2>

  <label for="produk">Pilih Produk:</label>
  <select id="produk">
    <option value="DRIP APKMOD">DRIP APKMOD</option>
    <option value="DRIP PROXY">DRIP PROXY</option>
    <option value="DRIP WIRE">DRIP WIRE</option>
    <option value="DRIP ROOT">DRIP ROOT</option>
  </select>

  <label for="durasi">Pilih Durasi:</label>
  <select id="durasi">
    <option value="6 Hours">6 Jam</option>
    <option value="12 Hours">12 Jam</option>
    <option value="1 Day">1 Day</option>
    <option value="3 Day">3 Day</option>
    <option value="7 Day">7 Day</option>
    <option value="15 Day">15 Day</option>
    <option value="30 Day">30 Day</option>
  </select>

  <label for="keys">Tempel/Paste Key (1 Key per Baris):</label>
  <textarea id="keys" placeholder="Contoh:&#10;KEY123&#10;KEY456&#10;KEY789"></textarea>

  <button type="button" id="btnUpload">🚀 Upload Semua Key Ke Firestore</button>

  <div id="status"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBsNz0BS6cQq2HOl4RIIPf4Rr9OJCeN61I",
    authDomain: "dripstore-db.firebaseapp.com",
    projectId: "dripstore-db",
    storageBucket: "dripstore-db.firebasestorage.app",
    messagingSenderId: "296010248275",
    appId: "1:296010248275:web:fb1ce779089f336c8dd6a6",
    measurementId: "G-9MXTJ6SLMV"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById("btnUpload").onclick = async function() {
    const produk = document.getElementById("produk").value;
    const durasi = document.getElementById("durasi").value;
    const rawKeys = document.getElementById("keys").value;
    const statusDiv = document.getElementById("status");

    const keyList = rawKeys.split("\n").map(k => k.trim()).filter(k => k !== "");

    if (keyList.length === 0) {
      alert("Masukkan minimal 1 key dulu, Bos!");
      return;
    }

    statusDiv.style.color = "yellow";
    statusDiv.innerText = `Sedang mengunggah ${keyList.length} key... Mohon tunggu...`;

    try {
      let suksesCount = 0;
      for (const key of keyList) {
        await addDoc(collection(db, "stok_key"), {
          key: key,
          produk: produk,
          durasi: durasi,
          status: "tersedia"
        });
        suksesCount++;
      }

      statusDiv.style.color = "#00ff66";
      statusDiv.innerText = `✅ SUKSES! ${suksesCount} key berhasil di-upload ke Firestore!`;
      document.getElementById("keys").value = "";
    } catch (err) {
      console.error(err);
      statusDiv.style.color = "red";
      statusDiv.innerText = "❌ Gagal mengunggah: " + err.message;
    }
  };
</script>

</body>
</html>
